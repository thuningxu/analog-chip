<svg xmlns="http://www.w3.org/2000/svg" width="640" height="264" viewBox="0 0 640 264">
  <!-- 0T1R passive cell.  Mirrors crossbar.py Cell(), passive=True branch. -->
  <rect x="0" y="0" width="640" height="264" fill="#ffffff"/>

  <text x="28" y="36" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a1a1a">0T1R passive cell</text>
  <text x="28" y="58" font-family="sans-serif" font-size="12.5" fill="#4a4a4a">CellParams(passive=True) &#8212; the memristor conductance alone, no access device</text>

  <!-- port context -->
  <text x="86" y="106" font-family="sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">row line</text>
  <text x="86" y="126" font-family="monospace" font-size="13" fill="#0072B2" text-anchor="middle">inp</text>
  <text x="514" y="106" font-family="sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">column line</text>
  <text x="514" y="126" font-family="monospace" font-size="13" fill="#0072B2" text-anchor="middle">out</text>

  <!-- wires -->
  <path d="M 86,150 H 260" stroke="#1a1a1a" stroke-width="1.8" fill="none"/>
  <path d="M 340,150 H 514" stroke="#1a1a1a" stroke-width="1.8" fill="none"/>

  <!-- memristor symbol: leads, body, internal square wave, polarity bar -->
  <path d="M 260,150 H 276" stroke="#1a1a1a" stroke-width="1.8" fill="none"/>
  <path d="M 324,150 H 340" stroke="#1a1a1a" stroke-width="1.8" fill="none"/>
  <rect x="276" y="139" width="48" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M 282,150 v -6 h 8 v 12 h 8 v -12 h 8 v 6" stroke="#1a1a1a" stroke-width="1.6" fill="none"/>
  <rect x="317" y="139" width="7" height="22" fill="#1a1a1a"/>

  <!-- terminal dots -->
  <circle cx="86" cy="150" r="3.4" fill="#1a1a1a"/>
  <circle cx="514" cy="150" r="3.4" fill="#1a1a1a"/>

  <!-- current direction, row line into column line -->
  <polygon points="440,150 429,144.5 429,155.5" fill="#1a1a1a"/>
  <text x="434" y="138" font-family="monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">I_cell</text>

  <!-- device labels -->
  <text x="300" y="184" font-family="monospace" font-size="12.5" fill="#D55E00" text-anchor="middle">rmem</text>
  <text x="300" y="202" font-family="monospace" font-size="11.5" fill="#4a4a4a" text-anchor="middle">r = 1 / g</text>
  <text x="300" y="218" font-family="monospace" font-size="11.5" fill="#4a4a4a" text-anchor="middle">g = g_min + w * (g_max - g_min)</text>

  <text x="28" y="236" font-family="sans-serif" font-size="10.5" fill="#4a4a4a">Cell declares sel and vss on both variants; the 0T1R branch leaves both unconnected, so the cell</text>
  <text x="28" y="252" font-family="sans-serif" font-size="10.5" fill="#4a4a4a">conducts unconditionally. Defaults: g_min = 1 uS at w = 0, g_max = 100 uS at w = 1.</text>
</svg>
